name: URL prüfen

# Ruft eine Adresse von aussen auf und meldet, was zurueckkommt.
# Aus der Entwicklungsumgebung heraus ist das nicht moeglich: Deren
# Netzwerkrichtlinie loest fremde Hostnamen nicht auf. Der Runner
# steht ausserhalb und sieht dasselbe wie ein Besucher.
#
# Aendert nichts. Nur Lesen.

on:
  workflow_dispatch:
    inputs:
      adresse:
        description: 'Vollstaendige URL, mit https://'
        required: true
        type: string

jobs:
  pruefen:
    name: Erreichbarkeit
    runs-on: ubuntu-latest
    steps:
      - name: Aufrufen
        run: |
          URL='${{ inputs.adresse }}'
          case "$URL" in
            https://*|http://*) ;;
            *) echo "FEHLER: Adresse muss mit http:// oder https:// beginnen."; exit 1 ;;
          esac

          echo "Adresse: $URL"
          echo

          echo "### DNS"
          host="$(printf '%s' "$URL" | sed -E 's#^https?://([^/?]+).*#\1#')"
          getent hosts "$host" || echo "  Name laesst sich nicht aufloesen."
          echo

          echo "### Antwort ohne Umleitungen zu folgen"
          curl -s -S -o /dev/null --max-time 25 \
               -w 'Status: %{http_code}\nUmleitung: %{redirect_url}\nZeit: %{time_total}s\nGroesse: %{size_download} Bytes\n' \
               "$URL" || echo "  Verbindung fehlgeschlagen."
          echo

          echo "### Antwort mit Umleitungen"
          curl -sL -o /dev/null --max-time 25 \
               -w 'Status: %{http_code}\nEndadresse: %{url_effective}\nUmleitungen: %{num_redirects}\n' \
               "$URL" || echo "  Verbindung fehlgeschlagen."
          echo

          echo "### Kopfzeilen"
          curl -sI --max-time 25 "$URL" | head -20 || true
          echo

          echo "### Zertifikat"
          echo | timeout 20 openssl s_client -connect "${host}:443" -servername "$host" 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates 2>/dev/null \
            || echo "  Kein Zertifikat abrufbar."
